name: Test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://qolmeia:qolmeia@localhost:5432/qolmeia_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qolmeia
          POSTGRES_PASSWORD: qolmeia
          POSTGRES_DB: qolmeia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qolmeia -d qolmeia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm test
