name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Check whether E2E inputs changed
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/e2e-pr.json"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/e2e-files.json"
          node <<'NODE'
          const fs = require('node:fs');
          const pr = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/e2e-pr.json'));
          const files = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/e2e-files.json')).flat();
          const docsOnly = (p) => /^(?:README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|AGENTS|CLAUDE)\.md$/.test(p)
            || /^docs\/.*\.md$/.test(p) || /^\.changeset\/[^/]+\.md$/.test(p);
          const complete = pr.head.sha === process.env.PR_HEAD && files.length === pr.changed_files && files.length < 3000;
          const run = !complete || files.length === 0 || files.some(f => !docsOnly(f.filename) || (f.previous_filename && !docsOnly(f.previous_filename)));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=' + run + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, run ? 'E2E inputs changed (or diff is uncertain): run the complete suite.\n' : 'Only standalone documentation changed: E2E is skipped.\n');
          NODE
  e2e:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: test-secret-minimum-32-characters-long-for-e2e
      EXPOSE_TESTING_API: 1
      CORS_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:3001
      # Auth is SAME-ORIGIN in the Next apps: next.config.ts rewrites
      # /api/auth/* to AUTH_SERVICE_INTERNAL_URL. The destination is baked
      # into the build output by `next build`, so it must be set here (build
      # step), not just at `next start`. No NEXT_PUBLIC_AUTH_URL: setting it
      # would bypass the rewrite and stop CI from exercising the same-origin
      # path that dev and prod use.
      AUTH_SERVICE_INTERNAL_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_AGENTS_URL: http://127.0.0.1:8787
      WEB_APP_URL: http://127.0.0.1:3001
      INTERNAL_SHARED_SECRET: e2e-internal-shared-secret-minimum-32-chars
      # Gates tests/e2e/client-magic-link/ and any future auth-email specs.
      # When unset (forks, contributors without secret access), those specs
      # `test.skip()` themselves; the rest of the e2e suite still runs.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_TEST }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Require a successful change check
        env:
          RESULT: ${{ needs.changes.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-e2e-push-main-
      - name: Restore Next.js compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: "apps/*/.next/cache"
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-push-main-
      - run: pnpm db:push
      # Build auth + the three Next apps. `agents` (Cloudflare Worker) isn't
      # under test here; the auth flows we exercise terminate on the auth
      # service + the Next proxies; the chat surface that talks to the
      # Worker is dead weight for these specs.
      - run: pnpm build --filter=api --filter=backoffice --filter=web --filter=landing
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browsers and system deps
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
